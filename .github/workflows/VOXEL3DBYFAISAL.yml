
name: BLOCKREALM Android APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract game ZIP
        run: |
          mkdir game
          unzip -q "realistic-3d-minecraft-game (5).zip" -d game

      - name: Install dependencies
        working-directory: game
        run: |
          npm ci
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Configure Capacitor
        working-directory: game
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.faisal.blockrealm",
            "appName": "BLOCKREALM",
            "webDir": "dist"
          }
          EOF

      - name: Build game
        working-directory: game
        run: npm run build

      - name: Create Android project
        working-directory: game
        run: npx cap add android

      - name: Sync Android
        working-directory: game
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: game/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKREALM-ANDROID-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
